services:
  postgres:
    image: postgres:16
    container_name: pg-ceronefritis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ceronefritis_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_ceronefritis:/var/lib/postgresql/data

volumes:
  pgdata_ceronefritis: